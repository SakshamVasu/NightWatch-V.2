<script>
/* The tested Nmap parser, transpiled from src/parser/*.ts. */
(function(global){

/* ==== util.ts ==== */
const ANSI_RE = /\u001b\[[0-9;?]*[ -/]*[@-~]/g;
const CTRL_RE = /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g;
function stripAnsi(text) {
    return text.replace(ANSI_RE, '').replace(/\r/g, '');
}
function isNoiseLine(line) {
    const t = line.trim();
    if (t === '') return false;
    if (/^[┌└├│]/.test(t)) return true;
    if (/^\(?[a-z0-9_.-]+㉿[a-z0-9_.-]+\)?/i.test(t)) return true;
    if (/^[#$]\s/.test(t)) return true;
    if (/^\s*[#$]\s*sudo\s+nmap/i.test(t)) return true;
    if (/^Stats:\s/.test(t)) return true;
    if (/^(NSE Timing|Service scan Timing|ARP Ping Scan Timing|SYN Stealth Scan Timing|Connect Scan Timing|UDP Scan Timing):/i.test(t)) return true;
    if (/^NSE: Active NSE Script Threads:/i.test(t)) return true;
    if (/percent (done|completed)/i.test(t) && /ETC:/i.test(t)) return true;
    return false;
}
function normalizeLines(raw) {
    const cleaned = stripAnsi(raw).replace(CTRL_RE, '');
    const out = [];
    for (const line of cleaned.split('\n')){
        if (isNoiseLine(line)) continue;
        out.push(line.replace(/\s+$/g, ''));
    }
    return out;
}
function findCommand(raw) {
    const cleaned = stripAnsi(raw);
    const m = cleaned.match(/(?:^|\n)\s*[#$]?\s*(sudo\s+)?nmap\s+[^\n]+/i);
    if (m) {
        return m[0].replace(/^\s*[#$]\s*/, '').replace(/\s*\|\s*tee\s+.*$/i, '').trim();
    }
    return undefined;
}
const CVE_RE = /CVE-\d{4}-\d{3,7}/gi;
function extractCves(text) {
    const found = text.match(CVE_RE) || [];
    return Array.from(new Set(found.map((c)=>c.toUpperCase())));
}
function parseVulnersRows(block) {
    const rows = [];
    const seen = new Set();
    for (const rawLine of block.split('\n')){
        const line = rawLine.replace(/^\|?_?\s*/, '').trim();
        if (!line) continue;
        const m = line.match(/^([A-Z0-9:_\-.]+)\s+(\d+(?:\.\d+)?)\s+(https?:\/\/\S+)(\s+\*EXPLOIT\*)?/i);
        if (!m) continue;
        const id = m[1];
        if (seen.has(id)) continue;
        seen.add(id);
        rows.push({
            id,
            score: parseFloat(m[2]),
            url: m[3],
            exploit: Boolean(m[4])
        });
    }
    return rows;
}
function scoreToSeverity(score) {
    if (score === undefined || Number.isNaN(score)) return 'UNRATED';
    if (score >= 9.0) return 'CRITICAL';
    if (score >= 7.0) return 'HIGH';
    if (score >= 4.0) return 'MEDIUM';
    if (score > 0) return 'LOW';
    return 'INFO';
}
function serviceLabel(service, product) {
    const s = (service || '').toLowerCase();
    const p = (product || '').toLowerCase();
    const map = {
        ftp: 'FTP',
        ssh: 'SSH',
        telnet: 'Telnet',
        smtp: 'SMTP',
        domain: 'DNS',
        http: 'HTTP',
        https: 'HTTPS',
        'ssl/http': 'HTTPS',
        rpcbind: 'RPC / Portmapper',
        'netbios-ssn': 'SMB / NetBIOS',
        'microsoft-ds': 'SMB',
        nfs: 'NFS',
        mysql: 'MySQL',
        postgresql: 'PostgreSQL',
        'ms-sql-s': 'MSSQL',
        oracle: 'Oracle',
        mongodb: 'MongoDB',
        redis: 'Redis',
        vnc: 'VNC',
        x11: 'X11',
        irc: 'IRC',
        'java-rmi': 'Java RMI',
        ajp13: 'AJP',
        distccd: 'distcc',
        exec: 'rexec',
        login: 'rlogin',
        shell: 'rshell',
        drb: 'Ruby DRb',
        bindshell: 'Bind Shell',
        'ccproxy-ftp': 'FTP',
        ident: 'ident',
        imap: 'IMAP',
        pop3: 'POP3',
        ldap: 'LDAP',
        rdp: 'RDP',
        'ms-wbt-server': 'RDP',
        snmp: 'SNMP',
        sip: 'SIP',
        memcached: 'Memcached',
        elasticsearch: 'Elasticsearch'
    };
    if (map[s]) return map[s];
    if (p.includes('tomcat') || s === 'http') {
        if (p.includes('tomcat')) return 'Tomcat';
    }
    if (p.includes('tomcat') || p.includes('coyote')) return 'Tomcat';
    if (s) return s.toUpperCase();
    return 'Unknown';
}
function isWebService(service, product, port) {
    const s = (service || '').toLowerCase();
    const p = (product || '').toLowerCase();
    if (/https?/.test(s) || s.includes('http')) return true;
    if (p.includes('apache') || p.includes('nginx') || p.includes('tomcat') || p.includes('coyote') || p.includes('httpd') || p.includes('iis') || p.includes('jetty') || p.includes('lighttpd')) return true;
    if (port && [
        80,
        443,
        8080,
        8000,
        8180,
        8443,
        8888,
        8009,
        3000,
        5000
    ].includes(port)) return true;
    return false;
}


/* ==== exploitation.ts ==== */
const yt = (q)=>({
        label: `YouTube: “${q}”`,
        url: `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`
    });
const hacktricks = (q)=>({
        label: 'HackTricks search',
        url: `https://cse.google.com/cse?cx=005180390956155036098:xxsz9prizt0&q=${encodeURIComponent(q)}`
    });
const searchsploit = (q)=>({
        label: `Exploit-DB: search “${q}”`,
        url: `https://www.exploit-db.com/search?q=${encodeURIComponent(q)}`
    });
const rapid7Module = (path)=>({
        label: `Rapid7: ${path}`,
        url: `https://www.rapid7.com/db/modules/${path.replace(/^exploit\//, 'exploit/').replace(/^auxiliary\//, 'auxiliary/')}`
    });
const cveLink = (id)=>({
        label: id,
        url: id.startsWith('CVE-') ? `https://nvd.nist.gov/vuln/detail/${id}` : `https://vulners.com/search?query=${encodeURIComponent(id)}`
    });
const KB = [
    {
        match: (id)=>id === 'ftp-vsftpd-backdoor',
        build: ()=>({
                summary: 'vsftpd 2.3.4 shipped with a malicious backdoor: supplying a username containing a ":)" smiley triggers a bind shell on TCP 6200 running as root. Exploitation connects to that shell — no password needed.',
                tools: [
                    'Metasploit: exploit/unix/ftp/vsftpd_234_backdoor',
                    'Nmap NSE: ftp-vsftpd-backdoor (already run — this is what flagged it)',
                    'netcat / telnet (to reach the backdoor port 6200 once triggered)'
                ],
                verify: [
                    'Confirm the banner really is vsftpd 2.3.4 (already parsed here).',
                    'Re-run the ftp-vsftpd-backdoor NSE check, or use the Metasploit module in a check-only step.',
                    'Look for TCP 6200 opening after a trigger attempt.'
                ],
                references: [
                    rapid7Module('exploit/unix/ftp/vsftpd_234_backdoor'),
                    {
                        label: 'ExploitDB: vsftpd 2.3.4 backdoor',
                        url: 'https://www.exploit-db.com/exploits/49757'
                    },
                    cveLink('CVE-2011-2523'),
                    hacktricks('vsftpd 2.3.4 backdoor')
                ],
                learning: [
                    yt('vsftpd 2.3.4 backdoor Metasploit tutorial'),
                    yt('Metasploit basics msfconsole exploit walkthrough')
                ]
            })
    },
    {
        match: (id)=>id === 'distcc-cve2004-2687',
        build: ()=>({
                summary: 'distcc, when configured to accept connections from any host, lets an attacker submit compilation jobs that run arbitrary commands as the distcc daemon user — remote command execution via a service-configuration weakness.',
                tools: [
                    'Metasploit: exploit/unix/misc/distcc_exec',
                    'Nmap NSE: distcc-cve2004-2687 (what flagged it here)'
                ],
                verify: [
                    'Confirm distccd is exposed on the detected port.',
                    'Use the NSE script or the Metasploit check to confirm command execution as the daemon user.'
                ],
                references: [
                    rapid7Module('exploit/unix/misc/distcc_exec'),
                    cveLink('CVE-2004-2687'),
                    {
                        label: 'distcc security notes',
                        url: 'https://distcc.github.io/security.html'
                    },
                    hacktricks('distcc 3632 exploit')
                ],
                learning: [
                    yt('distcc distcc_exec Metasploit CVE-2004-2687 tutorial')
                ]
            })
    },
    {
        match: (id)=>id === 'rmi-vuln-classloader' || id.includes('java-rmi'),
        build: ()=>({
                summary: 'A default-configured Java RMI registry allows loading classes from a remote URL, which an attacker abuses to load and execute a malicious class — leading to remote code execution.',
                tools: [
                    'Metasploit: exploit/multi/misc/java_rmi_server',
                    'ysoserial (for RMI/deserialization gadget chains, context-dependent)',
                    'Nmap NSE: rmi-vuln-classloader / rmi-dumpregistry'
                ],
                verify: [
                    'Confirm the RMI registry port is reachable.',
                    'Use the Metasploit module in check mode to confirm remote class loading is permitted.'
                ],
                references: [
                    rapid7Module('exploit/multi/misc/java_rmi_server'),
                    hacktricks('Java RMI 1099 exploitation'),
                    {
                        label: 'ysoserial (GitHub)',
                        url: 'https://github.com/frohoff/ysoserial'
                    }
                ],
                learning: [
                    yt('Java RMI java_rmi_server Metasploit exploitation tutorial')
                ]
            })
    },
    {
        match: (id)=>id === 'irc-unrealircd-backdoor',
        build: ()=>({
                summary: 'A trojaned UnrealIRCd build (2009–2010 distribution) contains a backdoor: a specially crafted command executed on the server runs arbitrary system commands.',
                tools: [
                    'Metasploit: exploit/unix/irc/unreal_ircd_3281_backdoor',
                    'Nmap NSE: irc-unrealircd-backdoor'
                ],
                verify: [
                    'Confirm the IRC service and that it is the backdoored UnrealIRCd build.',
                    'Use the module/NSE check to confirm command execution.'
                ],
                references: [
                    rapid7Module('exploit/unix/irc/unreal_ircd_3281_backdoor'),
                    cveLink('CVE-2010-2075'),
                    hacktricks('UnrealIRCd backdoor 6667')
                ],
                learning: [
                    yt('UnrealIRCd 3.2.8.1 backdoor Metasploit tutorial')
                ]
            })
    },
    {
        match: (id)=>id === 'ssl-poodle',
        build: ()=>({
                summary: 'POODLE abuses SSLv3’s CBC padding as a padding-oracle: a man-in-the-middle who can force an SSLv3 downgrade decrypts small secrets (e.g. a cookie) byte-by-byte. It requires an active MITM position, not just reachability.',
                tools: [

        if (/Status:\s*Up/i.test(rest)) h.status = 'up';

        const osm = rest.match(/OS:\s*([^\t]+)/);
        if (osm) {
            h.os = osm[1].trim();

        const pm = rest.match(/Ports:\s*([^\t]+)/);

                const proto = f[2] || 'tcp';
                const service = (f[4] || '').trim() || undefined;
                const versionRaw = (f[6] || '').trim();
                const p = {
                    port,
                    protocol: proto,

                    service,
                    host: ip,
                    scripts: {}

        hosts,

function splitProductVersion(p, text) {
    const words = text.split(/\s+/);

    if (idx === -1) {
        p.product = text.replace(/\s*\(.*$/, '').trim() || text;
        const extra = text.match(/\((.*)\)\s*$/);
        if (extra) p.extra = extra[1];
        return;
    }
    p.product = words.slice(0, idx).join(' ');
    const rest = words.slice(idx).join(' ');
    const paren = rest.indexOf('(');
    if (paren >= 0) {
        p.version = rest.slice(0, paren).trim();
        p.extra = rest.slice(paren).replace(/^\(+|\)+$/g, '').trim();

const CONFIRMED = 'CONFIRMED';

function answerLocally(scan, question) {

    const portMatch = q.match(/\b(?:port\s*)?(\d{1,5})\b/);
    if (portMatch && (/port|open|closed|\bis\b/.test(q) || /^\d+$/.test(q))) {
        return portAnswer(scan, parseInt(portMatch[1], 10));
    }
    const namedEarly = findByKeyword(scan, q);
    if (namedEarly && /\b(about|tell|info|detail|explain|what is|whats|describe)\b/.test(q)) {
        return namedEarly;
    }
    if (/\b(summary|overview|overall|what did (you|the scan) find|results?)\b/.test(q)) {
        return summaryAnswer(scan);
    }
    if (/\b(most )?(critical|worst|dangerous|severe|serious|biggest|top|priority|urgent|first)\b/.test(q)) {
        return criticalAnswer(scan);
    }
    if (/\bconfirmed\b/.test(q)) return listVulns(scan, CONFIRMED, 'confirmed');
    if (/\bpotential\b/.test(q)) return listVulns(scan, POTENTIAL, 'potential');
    if (/\b(fix|remediat|prevent|patch|mitigat|how (do|to)|secure|harden|solve|remove)\b/.test(q)) {
        return remediationAnswer(scan, q);
    }
    if (/\b(exploit|attack|tool|metasploit|hack|penetrat|how.*(exploit|attack))\b/.test(q)) {
        return exploitationAnswer(scan, q);
    }
    const cveMatch = question.match(/CVE-\d{4}-\d{3,7}/i);
    if (cveMatch) return cveAnswer(scan, cveMatch[0].toUpperCase());
    if (/\b(web|http|website|directon|directories|url|apache|nginx|php)\b/.test(q)) {
        return webAnswer(scan);
    }
    if (/\b(host|os|operating system|mac|vendor|target|machine)\b/.test(q)) {
        return hostAnswer(scan);
    }
    if (/\b(service|port|open port|what.?s running|running)\b/.test(q)) {
        return portsAnswer(scan);
    }

function criticalAnswer(scan) {

    }

        Medium: 2,

/* Inline SVG charts — no external chart library, so this works offline too. */
function DonutChart({data,size=176}){
  const total=data.reduce((s,d)=>s+d.value,0);const R=70,r=45,cx=size/2,cy=size/2;
  if(!total)return null;let a=-Math.PI/2;
  const seg=data.map(d=>{const frac=d.value/total;const a2=a+frac*Math.PI*2;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
    const large=frac>0.5?1:0;const mid=(a+a2)/2;a=a2;
    const path=`M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi2} ${yi2} Z`;
    return {path,color:d.color,name:d.name,value:d.value,pct:Math.round(frac*100),lx:cx+((R+r)/2)*Math.cos(mid),ly:cy+((R+r)/2)*Math.sin(mid)};});
  return <svg viewBox={`0 0 ${size} ${size}`} width="100%" height={size}>
    {seg.map((s,i)=><path key={i} d={s.path} fill={s.color}><title>{s.name}: {s.value} ({s.pct}%)</title></path>)}
    {seg.filter(s=>s.pct>=8).map((s,i)=><text key={i} x={s.lx} y={s.ly} fill="#080808" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">{s.pct}%</text>)}
  </svg>;
}
function HBarChart({data,height=224}){
  if(!data.length)return null;const max=Math.max(...data.map(d=>d.cves),1);
  const rowH=Math.min(28,(height-10)/data.length);const labelW=76,pad=8;
  return <svg viewBox={`0 0 400 ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{overflow:'visible'}}>
    {data.map((d,i)=>{const y=i*rowH+2;const w=Math.max(2,(d.cves/max)*(400-labelW-pad-30));
      return <g key={i}>
        <text x={labelW-6} y={y+rowH/2} fill="#94a3b8" fontSize="11" textAnchor="end" dominantBaseline="middle">{d.name}</text>
        <rect x={labelW} y={y+2} width={w} height={rowH-6} fill="#ffffff" rx="2"><title>{d.name}: {d.cves} CVEs</title></rect>
        <text x={labelW+w+5} y={y+rowH/2} fill="#cbd5e1" fontSize="10" dominantBaseline="middle">{d.cves}</text>
      </g>;})}
  </svg>;
}

  MEDIUM:['#facc15','rgba(250,204,21,.15)'], LOW:['#ffffff','rgba(255,255,255,.15)'],
  INFO:['#94a3b8','rgba(100,116,139,.15)'], UNRATED:['#64748b','rgba(71,85,105,.2)'],
};
const CONF = {
  CONFIRMED:['#f43f5e','rgba(244,63,94,.15)'], POTENTIAL:['#facc15','rgba(250,204,21,.15)'],
  INFORMATIONAL:['#ffffff','rgba(255,255,255,.15)'], UNKNOWN:['#94a3b8','rgba(100,116,139,.15)'],
};
function Badge({text,colors}){return <span className="badge" style={{color:colors[0],background:colors[1],border:'1px solid '+colors[0]+'55'}}>{text}</span>;}
const SevBadge=({v})=><Badge text={v} colors={SEV[v]||SEV.UNRATED}/>;
const ConfBadge=({v})=><Badge text={v==='INFORMATIONAL'?'INFO':v[0]+v.slice(1).toLowerCase()} colors={CONF[v]||CONF.UNKNOWN}/>;
function StateBadge({s}){const l=s.toLowerCase();
  const c=l.startsWith('open')?['#34d399','rgba(52,211,153,.15)']:l.includes('filtered')?['#fbbf24','rgba(251,191,36,.15)']:['#94a3b8','rgba(100,116,139,.2)'];
  return <Badge text={s} colors={c}/>;}
function Copy({text}){const[d,setD]=useState(false);
  return <button className="btn" style={{padding:'4px 8px',fontSize:12}} onClick={async()=>{try{await navigator.clipboard.writeText(text);setD(true);setTimeout(()=>setD(false),1200);}catch(e){}}}>{d?'Copied':'Copy'}</button>;}
function Empty({title,hint}){return <div style={{border:'1px dashed rgba(255,255,255,0.22)',borderRadius:12,padding:'56px 0',textAlign:'center',background:'rgba(11,17,28,.4)'}}>
  <p style={{fontSize:14,fontWeight:500,color:'#cbd5e1',margin:0}}>{title}</p>{hint&&<p style={{fontSize:12,color:'#64748b',maxWidth:420,margin:'6px auto 0'}}>{hint}</p>}</div>;}
